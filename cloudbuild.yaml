# CI/CD: unit tests -> LLM evals (gate) -> build both images -> deploy to GKE
steps:
  - name: python:3.12-slim
    id: unit-tests
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.txt && pytest -q"]

  - name: python:3.12-slim
    id: llm-evals
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.txt && (uvicorn mock_backend.main:app --port 9000 &) && sleep 2 && python -m app.rag.ingest data/knowledge/*.md && python -m evals.run_evals"]
    env: ["GOOGLE_CLOUD_PROJECT=$PROJECT_ID", "GOOGLE_GENAI_USE_VERTEXAI=TRUE", "APP_ENV=ci", "IR_BACKEND_URL=http://localhost:9000"]
    secretEnv: ["DATABASE_URL"]

  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/ir/ir-credit-agent:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/ir/ir-mock-backend:$SHORT_SHA", "-f", "mock_backend/Dockerfile", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "us-central1-docker.pkg.dev/$PROJECT_ID/ir/ir-credit-agent"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "us-central1-docker.pkg.dev/$PROJECT_ID/ir/ir-mock-backend"]

  - name: gcr.io/cloud-builders/gke-deploy
    args: ["run", "--filename=k8s/", "--location=us-central1", "--cluster=ir-cluster"]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/ir-agent-database-url/versions/latest
      env: DATABASE_URL
