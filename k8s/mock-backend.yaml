apiVersion: apps/v1
kind: Deployment
metadata: { name: ir-mock-backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: ir-mock-backend } }
  template:
    metadata: { labels: { app: ir-mock-backend } }
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/PROJECT_ID/ir/ir-mock-backend:latest
          ports: [{ containerPort: 9000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9000 } }
---
apiVersion: v1
kind: Service
metadata: { name: ir-mock-backend }
spec:
  selector: { app: ir-mock-backend }
  ports: [{ port: 80, targetPort: 9000 }]
